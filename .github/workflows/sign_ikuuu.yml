name: Auto Sign-in for BBS

on:
  schedule:
    - cron: '10 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ikuuu-checkin
  cancel-in-progress: false

jobs:
  sign_in_job:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Select sign-in method
        id: method
        env:
          TELEGRAM_WEB_SESSION: ${{ secrets.TELEGRAM_WEB_SESSION }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          if [[ -n "$TELEGRAM_WEB_SESSION" ]]; then
            echo 'backend=telegram-web' >> "$GITHUB_OUTPUT"
          elif [[ -n "$TELEGRAM_SESSION" ]]; then
            echo 'backend=telegram' >> "$GITHUB_OUTPUT"
          else
            echo 'backend=website' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Telegram Web dependencies
        if: steps.method.outputs.backend == 'telegram-web'
        run: |
          pip install -r requirements-telegram-web.txt
          python -m playwright install --with-deps chromium

      - name: Test Telegram Web sign-in logic
        if: steps.method.outputs.backend == 'telegram-web'
        run: python -m unittest -v test_telegram_web_signin

      - name: Run Telegram Web sign-in
        if: steps.method.outputs.backend == 'telegram-web'
        env:
          TELEGRAM_WEB_SESSION: ${{ secrets.TELEGRAM_WEB_SESSION }}
        run: python telegram_web_signin.py

      - name: Install Telegram dependencies
        if: steps.method.outputs.backend == 'telegram'
        run: pip install -r requirements-telegram.txt

      - name: Test Telegram sign-in logic
        if: steps.method.outputs.backend == 'telegram'
        run: python -m unittest -v test_telegram_signin

      - name: Run Telegram sign-in
        if: steps.method.outputs.backend == 'telegram'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python telegram_signin.py

      - name: Install website dependencies
        if: steps.method.outputs.backend == 'website'
        run: |
          pip install requests
          pip install playwright
          pip install git+https://github.com/qqhsx/my-utils.git

      # 安装 Chromium 浏览器
      - name: Install Playwright Browsers
        if: steps.method.outputs.backend == 'website'
        run: |
          playwright install chromium

      - name: Run sign-in script
        if: steps.method.outputs.backend == 'website'
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          IKUUU_COOKIES: ${{ secrets.IKUUU_COOKIES }}
          WX_CORPID: ${{ secrets.WX_CORPID }}
          WX_CORPSECRET: ${{ secrets.WX_CORPSECRET }}
          WX_AGENTID: ${{ secrets.WX_AGENTID }}
        run: python sign_ikuuu.py
